# SPDX-License-Identifier: Apache-2.0
# Gate graphical/serial runtimes, SDKs, guest tools and bounded bootstrap feasibility evidence.
name: Bare-metal boot

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install host utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso curl dpkg-dev gcc g++ binutils make musl-tools qemu-user e2fsprogs openssl python3
      - name: Load the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path user/Cargo.toml --all -- --check
          rustfmt --edition 2024 --check sdk/templates/rust/main.rs sdk/templates/rust/offline-message/src/lib.rs
      - name: Check file-purpose explanations
        run: cargo xtask check-files
      - name: Check host tools
        run: cargo clippy --locked -p xtask -p anova-platform -p anova-memory -p anova-abi -p anova-elf -p anova-sched -p anova-vfs -p anova-storage -p anova-graphics -p anova-input -p anova-gui -p anova-gui-runtime --all-targets -- -D warnings
      - name: Check and build native Rust/C applications
        run: |
          cargo xtask check-apps
          cargo xtask apps
      - name: Trace pinned Linux applications on the host
        run: cargo xtask trace-compat
      - name: Check the bare-metal kernel
        run: |
          cargo clippy --locked -p anova-kernel --target x86_64-unknown-none --features qemu-test -- -D warnings
          cargo clippy --locked -p anova-kernel --target x86_64-unknown-none --features bootstrap-metrics -- -D warnings
          cargo clippy --locked -p anova-kernel --target x86_64-unknown-none --features test-double-fault -- -D warnings
          cargo clippy --locked -p anova-kernel --target x86_64-unknown-none --features test-no-execute -- -D warnings
          cargo clippy --locked -p anova-kernel --target x86_64-unknown-none --features graphics -- -D warnings
          cargo clippy --locked -p anova-kernel --target x86_64-unknown-none --features input-test -- -D warnings
          cargo clippy --locked -p anova-kernel --target x86_64-unknown-none --features graphics,gui -- -D warnings
          cargo clippy --locked -p anova-kernel --target x86_64-unknown-none --features graphics,gui,gui-test -- -D warnings
          cargo clippy --locked -p anova-kernel --target x86_64-unknown-none --features gpu -- -D warnings
          cargo clippy --locked -p anova-kernel --target x86_64-unknown-none --features gpu-test -- -D warnings
      - name: Test host logic
        run: cargo xtask test-host
      - name: Test bootstrap source integrity and archive rejection
        run: |
          python3 ports/bootstrap/test_prepare.py
          python3 ports/bootstrap/test_gcc_probe.py
          python3 ports/bootstrap/test_rust_probe.py
      - name: Build the kernel
        run: cargo xtask build
      - name: Fetch verified boot inputs
        run: cargo xtask fetch
      - name: Check prerequisites
        run: cargo xtask doctor
      - name: Verify M9 pthread/signals/dynamic musl, VFS, isolation, memory and traps
        run: cargo xtask verify
      - name: Verify real serial input and volatile tmpfs across boots
        run: cargo xtask terminal-test
      - name: Verify software graphics, QMP screenshot and serial fallback
        run: cargo xtask graphics-test
      - name: Verify bounded GPU admission and headless CPU fallback
        run: cargo xtask gpu-fallback-test
      - name: Verify polled PS2 keyboard, pointer, cursor pixels and device fallback
        run: cargo xtask input-test
      - name: Verify isolated native windows, physical input, redraw and compositor recovery
        run: cargo xtask gui-test
      - name: Verify persistent sources, binaries, clean shutdown and device failures
        run: cargo xtask persistence-test
      - name: Verify controlled virtio networking, DNS and socket boundaries
        run: cargo xtask network-test
      - name: Verify offline packages, reboot rollback and strict HTTPS
        run: cargo xtask package-test
      - name: Verify versioned SDK templates, package policy and crash symbols
        run: |
          cargo xtask sdk-test
          cargo xtask app-test
          cargo xtask package-v2-test
          cargo xtask diagnostics-test
      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qemu-boot-evidence
          path: |
            build/logs/
            build/input/
            build/gui/
            build/gpu/
          if-no-files-found: ignore


  guest-toolchain:
    needs: boot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install compiler construction and guest test utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso curl dpkg-dev gcc g++ make musl-tools e2fsprogs openssl python3 m4 bison flex texinfo
      - name: Load the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch verified boot inputs
        run: cargo xtask fetch
      - name: Build the locked GCC, sysroot and make from source
        env:
          ANOVA_BUILD_JOBS: 2
        run: cargo xtask toolchain-build
      - name: Verify guest C/C++, incremental make, negative builds and reboot retention
        run: cargo xtask toolchain-test
      - name: Verify guest tool reconstruction, resource limits and reboot retention
        run: cargo xtask bootstrap-test
      - name: Assess locked GCC source capacity and guest prerequisite blockers
        run: cargo xtask bootstrap-gcc-test
      - name: Prepare locked upstream Rust musl tools and offline vendor
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo xtask rust-build
      - name: Assess independent LLVM, rustc and Cargo source-build prerequisites
        run: cargo xtask bootstrap-rust-test
      - name: Verify Rust std, detached threads and real compiler startup
        run: |
          cargo xtask rust-cross-test
          cargo xtask rust-runtime-test
      - name: Verify guest Rust, offline Cargo, build scripts, C FFI, macros and reboot
        run: cargo xtask rust-test
      - name: Verify guest-built native GUI SDK clients, scanout, input and reboot
        run: |
          cargo xtask gui-sdk-test
          cargo xtask gui-sdk-replay
      - name: Verify online Cargo, strict TLS, transport failures and offline rebuild
        run: cargo xtask rust-online-test
      - name: Upload compiler build and guest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guest-toolchain-evidence
          path: |
            build/logs/
            build/toolchain/rebuild/*.log
            build/toolchain/package.sha256
            build/toolchain/stage.sha256
            build/toolchain/archive.sha256
            build/bootstrap/inputs.json
            build/bootstrap/prepared.json
            build/bootstrap-gcc/source-audit.json
            build/bootstrap-gcc/prepared.json
            build/bootstrap-rust/source-audit.json
            build/bootstrap-rust/prepared.json
            build/rust/stage.sha256
            build/rust/archive.sha256
            build/gui-sdk/
          if-no-files-found: ignore
