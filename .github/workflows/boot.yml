# SPDX-License-Identifier: Apache-2.0
# Gates source purpose, CPU/FPU scheduling, native lifecycle and complete QEMU regressions.
name: Bare-metal boot

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install host utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso curl dpkg-dev gcc
      - name: Load the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path user/Cargo.toml --all -- --check
      - name: Check file-purpose explanations
        run: cargo xtask check-files
      - name: Check host tools
        run: cargo clippy --locked -p xtask -p anova-platform -p anova-memory -p anova-abi -p anova-elf -p anova-sched --all-targets -- -D warnings
      - name: Check and build native Rust/C applications
        run: |
          cargo xtask check-apps
          cargo xtask apps
      - name: Check the bare-metal kernel
        run: |
          cargo clippy --locked -p anova-kernel --target x86_64-unknown-none --features qemu-test -- -D warnings
          cargo clippy --locked -p anova-kernel --target x86_64-unknown-none --features test-double-fault -- -D warnings
          cargo clippy --locked -p anova-kernel --target x86_64-unknown-none --features test-no-execute -- -D warnings
      - name: Test host logic
        run: cargo xtask test-host
      - name: Build the kernel
        run: cargo xtask build
      - name: Fetch verified boot inputs
        run: cargo xtask fetch
      - name: Check prerequisites
        run: cargo xtask doctor
      - name: Verify scheduling, process lifecycle, user isolation, memory and traps
        run: cargo xtask verify
      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qemu-boot-evidence
          path: build/logs/
          if-no-files-found: ignore

