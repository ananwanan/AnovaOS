# SPDX-License-Identifier: Apache-2.0
# Use stable rustfmt options and the same style in editors and on the command line.
edition = "2024"
style_edition = "2024"

max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"

reorder_imports = true
reorder_modules = true
use_field_init_shorthand = true
use_try_shorthand = true
