# SPDX-License-Identifier: Apache-2.0
[package]
name = "anova-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "anova-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
limine = "=0.5.0"
anova-platform = { path = "../crates/platform" }

[features]
qemu-test = []
test-panic = ["qemu-test"]
test-timeout = ["qemu-test"]
test-invalid-opcode = ["qemu-test"]
test-general-protection = ["qemu-test"]
test-page-fault = ["qemu-test"]
test-double-fault = ["qemu-test"]

