# SPDX-License-Identifier: Apache-2.0
# Builds the bare-metal kernel and isolated QEMU failure-injection configurations.
[package]
name = "anova-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "anova-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
limine = "=0.5.0"
anova-platform = { path = "../crates/platform" }
anova-memory = { path = "../crates/memory" }
anova-abi = { path = "../crates/abi" }
anova-elf = { path = "../crates/elf" }
anova-sched = { path = "../crates/sched" }

[features]
qemu-test = []
test-panic = ["qemu-test"]
test-timeout = ["qemu-test"]
test-invalid-opcode = ["qemu-test"]
test-general-protection = ["qemu-test"]
test-page-fault = ["qemu-test"]
test-double-fault = ["qemu-test"]
test-stack-guard = ["qemu-test"]
test-read-only = ["qemu-test"]
test-no-execute = ["qemu-test"]
test-direct-no-execute = ["qemu-test"]
test-unmapped = ["qemu-test"]
test-oom = ["qemu-test"]

