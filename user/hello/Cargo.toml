# Builds the Rust hello ELF that verifies startup arguments, zeroed BSS and SSE2.
[package]
name = "hello-rust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
build = "../build.rs"

[[bin]]
name = "hello-rust"
path = "src/main.rs"
test = false
bench = false

[dependencies]
anova-rt = { path = "../rt" }
