# Keeps native user ELF builds separate from the bare-metal kernel's target flags.
[workspace]
members = ["rt", "hello", "probe", "process", "init", "shell", "fs-test", "editor", "gui-common", "compositor", "gui-client", "gui-test", "gui-run"]
resolver = "3"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
codegen-units = 1
