# SPDX-License-Identifier: Apache-2.0
# Build the isolated native software compositor; window policy stays in user space.
[package]
name = "compositor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
build = "../build.rs"

[[bin]]
name = "compositor"
path = "src/main.rs"
test = false
bench = false

[dependencies]
anova-rt = { path = "../rt" }
anova-gui = { path = "../../crates/gui" }
anova-gui-user = { path = "../gui-common" }
