# SPDX-License-Identifier: Apache-2.0
# Builds host-side dependency, native-app, image, graphical/serial QEMU and evidence commands.
[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
toml = "=0.8.23"
anova-abi = { path = "../crates/abi" }
anova-elf = { path = "../crates/elf" }

anova-vfs = { path = "../crates/vfs" }
anova-storage = { path = "../crates/storage" }
anova-graphics = { path = "../crates/graphics" }
